<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Team AceTP 🇮🇳</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;

      background: linear-gradient(
        180deg,
        #ff9933 0%,
        #ffffff 50%,
        #138808 100%
      );

      font-family: Arial, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 500px;
      padding: 25px;
      text-align: center;

      background: rgba(255,255,255,0.92);
      border-radius: 25px;

      box-shadow: 0 10px 35px rgba(0,0,0,0.25);
    }

    .flag {
      font-size: 42px;
    }

    h1 {
      margin: 10px 0;
      font-size: 30px;
      color: #222;
    }

    h2 {
      margin: 0 0 20px;
      color: #ff6f00;
      font-size: 20px;
    }

    img {
      width: 100%;
      border-radius: 18px;
      display: block;
    }

    .message {
      margin-top: 20px;
      font-size: 17px;
      line-height: 1.5;
      color: #333;
    }

    .team {
      margin-top: 18px;
      font-size: 26px;
      font-weight: bold;
      letter-spacing: 3px;
      color: #138808;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="flag">🇮🇳</div>

    <h1>Happy Independence Day</h1>

    <h2>Celebrating the Spirit of Freedom</h2>

    <img src="independence-day.png.png" alt="Independence Day">

    <div class="message">
      Together we celebrate the spirit of our incredible nation!
    </div>

    <div class="team">
      TEAM ACETP
    </div>

    <div class="flag">🇮🇳</div>

  </div>

</body>
</html>
